[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrack"
version = "0.2.0"
description = "Drone road inspection: pothole detection, measurement, geotagging and wire avoidance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rakesh Vamshi Pullagura" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
skytrack = "skytrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
